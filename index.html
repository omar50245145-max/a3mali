<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أعمالي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1ebe2">
<meta name="color-scheme" content="light only">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'">
<title>أعمالي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* أعمالي — الإصدار الثالث: هوية «القهوة والورق» من الصور التي اختارها المعلم:
   أرضية كريمية، وبطاقة بنية لليوم، وألوان باستيل للأولويات، وخط الرقعة للملاحظات المكتوبة باليد. ألوان فاتحة دائماً. */
:root{
  --ground:#f1ebe2; --surface:#fbf8f3; --raised:#f5efe6; --active:#e9dfd2;
  --border:#e2d6c7; --rule:#ece3d7; --control:#cdbfae;
  --text:#2f241d; --muted:#7d6d5f;
  --brown:#6b4c38; --brown-ink:#4b3426; --brown-soft:#8a6a52; --brown-pale:#ece2d6; --cream-hi:#e9c9a6;
  --rose:#f3dedb; --rose-ink:#a84a40; --honey:#f4e8cc; --honey-ink:#94701c; --honey-bright:#d8ad55;
  --sage:#dfeadf; --sage-ink:#3f7a4c; --stone:#ebe7e2; --stone-ink:#665d55; --sky:#e0e6ef; --sky-ink:#40618c;
  --positive:#3f7a4c; --negative:#a8352b;
  /* أسماء قديمة يستعملها الكود: تشير إلى ألوان الهوية الجديدة */
  --sea:var(--brown); --sea-ink:var(--brown-ink); --sea-pale:var(--brown-pale);
  --lapis:var(--sky-ink); --lapis-pale:var(--sky);
  --gold:var(--honey-ink); --gold-bright:var(--honey-bright); --gold-field:#8a6a1c; --gold-pale:var(--honey);
  --sadu:var(--rose-ink); --sadu-pale:var(--rose); --amber:#8a5410; --amber-pale:#f8e6cc;
  --radius-card:22px; --radius-control:14px;
  --lift:0 1px 0 var(--border),0 6px 18px -10px rgba(75,52,38,.18);
  --font:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --hand:'Aref Ruqaa','Readex Pro',serif;
  --shade:rgba(40,28,20,.45);
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
/* ألوان تصنيفات الإنجازات العشرة */
.k0{--k:#0f5e63;--kp:#dcefed}.k1{--k:#2c4a8c;--kp:#e2e8f6}.k2{--k:#9a5e08;--kp:#fbecd2}.k3{--k:#a3302a;--kp:#f8e3df}.k4{--k:#4c5a68;--kp:#e6eaee}
.k5{--k:#1f7a50;--kp:#dcf1e5}.k6{--k:#7d6010;--kp:#f6edd2}.k7{--k:#6b3f8f;--kp:#eee4f6}.k8{--k:#b04524;--kp:#fbe5dc}.k9{--k:#7a4a2a;--kp:#f1e5da}

*{box-sizing:border-box}
html,body,*{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease,transform .1s ease}
button:active:not([disabled]){transform:scale(.96)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.dim{color:var(--muted)}
.small{font-size:13.5px}
.hand{font-family:var(--hand);color:var(--brown-soft);font-size:21px;line-height:1.4}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* الإطار */
.app{position:relative;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}
.scr{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.scr>*{min-width:0;flex:0 0 auto}

/* الرأس: التحية والتاريخان */
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello h1{font-size:21px;font-weight:700}
.hello .d{font-size:13px;color:var(--muted)}
.av{width:44px;height:44px;border-radius:15px;border:0;background:var(--active);color:var(--brown);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ph h1{font-size:25px;font-weight:700;color:var(--brown-ink)}
.ph .sub{font-size:13px;color:var(--muted)}
.mark{width:40px;height:40px;flex:0 0 auto}

/* البطاقة البنية: مساحتك لليوم / إنجاز الروتين */
.brown{position:relative;overflow:hidden;background:var(--brown);color:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.brown::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06);left:-40px;bottom:-60px;pointer-events:none}
.brown .row{position:relative;z-index:1}
.brown .lb{font-size:12.5px;color:rgba(255,255,255,.8)}
.brown .big{font-size:19px;font-weight:700;line-height:1.4}
.pill{border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;padding:3px 11px;flex:0 0 auto;white-space:nowrap}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--cream-hi);width:var(--w);animation:barfill .6s ease-out}
@keyframes barfill{from{width:var(--from)}to{width:var(--w)}}
.stats{display:grid;grid-template-columns:1fr 1px 1fr;gap:10px;align-items:center;text-align:center}
.stats b{display:block;font-size:20px;line-height:1.3}
.stats span{font-size:12px;color:rgba(255,255,255,.8)}
.stats hr{border:0;width:1px;height:34px;background:rgba(255,255,255,.2);margin:0}

/* شريط الأيام */
.days{display:grid;grid-template-columns:26px repeat(5,minmax(0,1fr)) 26px;gap:5px;align-items:center}
.days .d{border:0;border-radius:16px;background:var(--surface);min-height:58px;padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);box-shadow:0 1px 0 var(--border);line-height:1.25}
.days .d span{font-size:11.5px;color:var(--muted)}
.days .d b{font-size:17px;font-weight:600}
.days .d i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:3px}
.days .d i.on{background:var(--brown-soft)}
.days .d[aria-pressed=true]{background:var(--brown);color:#fff;box-shadow:none}
.days .d[aria-pressed=true] span{color:rgba(255,255,255,.8)}
.days .d[aria-pressed=true] i.on{background:var(--cream-hi)}
.days .d.today:not([aria-pressed=true]){box-shadow:inset 0 0 0 1.5px var(--brown-soft)}
.days .w{border:0;background:transparent;color:var(--brown-soft);font-size:17px;min-height:44px;padding:0}

/* التقاط مهامي */
.capture{border:0;width:100%;text-align:start;background:var(--active);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:var(--text)}
.capture .ico{width:44px;height:44px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--brown);flex:0 0 auto}
.capture b{font-size:15px}
.capture .new{font-size:11px;background:var(--brown);color:#fff;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.capture p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}

/* عناوين الأقسام */
.sec{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;padding-top:2px}
.sec .s{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted)}
.sec i{width:9px;height:9px;border-radius:50%;background:var(--brown-soft);display:inline-block;flex:0 0 auto}
.sec.eve i{background:var(--sky-ink)}
.sec button.s{border:0;background:transparent;padding:4px 0;min-height:36px}

/* جدول اليوم في أول الصفحة */
.sched{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--lift);padding:14px 14px 4px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:10px}
.shd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shd .tt b{display:block;font-size:20px;font-weight:700;color:var(--brown-ink);line-height:1.35}
.shd .tt span{font-size:12.5px;color:var(--muted)}
.shd .cnt{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--brown-ink);background:var(--brown-pale);border-radius:999px;padding:3px 11px;white-space:nowrap}
.sched .bar{background:var(--brown-pale);height:6px}
.sched .bar i{background:var(--brown)}
.sl .it .tm b{font-size:14px;font-weight:700}
.sched .sl .it:last-child{border-bottom:0}
.nowl{display:flex;align-items:center;gap:6px;height:24px;color:var(--amber);font-size:11.5px;font-weight:700}
.nowl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);flex:0 0 auto}
.nowl::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--amber);opacity:.7}
.sdiv{font-size:12px;font-weight:700;color:var(--muted);padding:10px 0 2px;border-bottom:1px dashed var(--rule)}
.sdiv.eve{color:var(--sky-ink)}
.tag.rtn{background:var(--sage);color:var(--sage-ink)}
.empty.in{box-shadow:none;background:transparent;padding:6px 0 12px}
.quad.sm{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quad.sm .q{min-height:48px;border-radius:14px;padding:5px 3px;gap:0}
.quad.sm .q b{font-size:16px;line-height:1.2}
.quad.sm .q span{font-size:11px;line-height:1.3;white-space:nowrap}

/* مربعات الأولوية */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{border:0;border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:84px;justify-content:center}
.q i{width:8px;height:8px;border-radius:50%}
.q b{font-size:22px;line-height:1.25;color:var(--text)}
.q span{font-size:12.5px;font-weight:500}
.q.r{background:var(--rose);color:var(--rose-ink)}.q.r i{background:var(--rose-ink)}
.q.h{background:var(--honey);color:var(--honey-ink)}.q.h i{background:var(--honey-ink)}
.q.s{background:var(--sage);color:var(--sage-ink)}.q.s i{background:var(--sage-ink)}
.q.g{background:var(--stone);color:var(--stone-ink)}.q.g i{background:var(--stone-ink)}
.q[aria-pressed=true]{box-shadow:inset 0 0 0 2px currentColor}

/* بطاقة الاجتماع القادم */
.next{border-radius:var(--radius-card);background:var(--sky);padding:12px 14px;display:flex;align-items:center;gap:12px}
.next .open{flex:1;min-width:0;border:0;background:transparent;text-align:start;display:flex;align-items:center;gap:12px;padding:0;color:var(--text)}
.next .ico{color:var(--sky-ink);display:flex;flex:0 0 auto}
.next .ico svg.ic{width:30px;height:30px;stroke-width:1.7}
.next .tx{flex:1;min-width:0}
.next b{display:block;font-size:16px}
.next .when{font-size:13.5px;color:var(--sky-ink);font-weight:600}
.next .pt{border:0;border-radius:999px;background:var(--surface);color:var(--sky-ink);min-height:40px;padding:0 12px;font-size:13.5px;font-weight:600;flex:0 0 auto}

/* جدول اليوم: الساعة يميناً، والعنوان مظلَّل بلون أولويته، وعلامة الإنجاز يساراً */
.list{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--lift);overflow:hidden;padding:0 12px}
.it{position:relative;display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);min-height:58px}
.it:last-child{border-bottom:0}
.it .tm{width:44px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;line-height:1.2;color:var(--muted)}
.it .tm b{font-size:13px;font-weight:600;color:var(--brown-ink);direction:ltr}
.it .tm small{font-size:11px}
.ck{position:relative;width:30px;height:30px;border-radius:10px;border:2px solid var(--control);background:transparent;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.ck::before{content:"";position:absolute;inset:-7px}
.ck svg.ic{width:16px;height:16px;stroke-width:2.6}
.it.done .ck,.rt.done .ck{background:var(--brown);border-color:var(--brown)}
.it .body{flex:1;min-width:0;border:0;background:transparent;text-align:start;padding:2px 0;color:var(--text);line-height:1.5;min-height:44px}
.it .t{position:relative;display:inline;font-weight:500;font-size:16px;overflow-wrap:anywhere}
.hl{padding:0 3px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.r{background:linear-gradient(transparent 50%,var(--rose) 50%)}
.hl.h{background:linear-gradient(transparent 50%,var(--honey) 50%)}
.hl.s{background:linear-gradient(transparent 50%,var(--sky) 50%)}
.it.done .t{text-decoration:line-through;color:var(--muted)}
.it.done .hl{background:none}
.it .m{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:500;background:var(--stone);color:var(--stone-ink);line-height:1.8}
.tag.meet{background:var(--sky);color:var(--sky-ink)}
.tag.time{background:var(--brown-pale);color:var(--brown-ink)}
.tag.star{background:var(--honey);color:var(--honey-ink)}
.tag.soon{background:var(--amber-pale);color:var(--amber)}
.tag.late{background:var(--rose);color:var(--negative)}
.tag.cal{background:var(--sage);color:var(--sage-ink)}
.tag.pri{background:var(--rose);color:var(--rose-ink)}
.tag svg.ic{width:13px;height:13px;stroke-width:2}
.it .go{width:44px;height:44px;border:0;border-radius:12px;background:var(--honey);color:var(--honey-ink);padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.it .go svg.ic{width:19px;height:19px}

/* لحظة الإنجاز: المربع ينضغط ثم يقفز، والعلامة تُرسم، وخط يعبر العنوان، وذرات بلون العسل */
.pop .ck{animation:ckpop .28s var(--spring)}
.pop .ck svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:tick .2s ease-out .08s forwards}
.it.pop .t::after{content:"";position:absolute;right:0;left:0;top:52%;height:2px;background:var(--muted);transform-origin:right;animation:strike .25s ease-out .12s both}
.pop .spk{position:absolute;width:6px;height:6px;border-radius:2px;background:var(--honey-bright);top:50%;left:14px;margin-top:-3px;animation:speck .45s ease-out .1s both;pointer-events:none}
.fold{animation:fold .3s ease-out .45s both}
@keyframes ckpop{0%{transform:scale(1)}35%{transform:scale(.82)}75%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes tick{to{stroke-dashoffset:0}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes speck{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--x),var(--y)) rotate(90deg)}}
@keyframes fold{to{opacity:.4}}

.empty{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--lift);padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-size:17px}
.alldone{background:var(--sage);border-radius:var(--radius-card);padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--sage-ink)}
.alldone .hand{color:var(--sage-ink);font-size:23px}

/* ما بقي من الأيام الماضية: هادئ بلا أحمر */
.carry{background:var(--honey);border-radius:var(--radius-card);padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.carry .row b{font-size:15px}
.carry .ci{background:rgba(255,255,255,.7);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.carry .ci .t{font-size:15px;overflow-wrap:anywhere}
.carry .ci .d{font-size:12px;color:var(--muted);margin-inline-start:6px}
.carry .acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{min-height:40px;border-radius:999px;border:0;padding:0 12px;font-size:13.5px;font-weight:500;background:var(--surface);color:var(--text);flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--border)}
.mini.pri{background:var(--brown);color:#fff;box-shadow:none}
.mini.gold{background:var(--gold-field);color:#fff;box-shadow:none}

/* مراجعة الأسبوع */
.review{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--lift);padding:14px;display:flex;flex-direction:column;gap:10px}
.review h2{font-size:17px;display:flex;align-items:center;gap:8px}
.review h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--honey-bright)}
.review .ri{display:flex;align-items:center;gap:8px}
.review .ri span{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}

/* الشرائط والتنبيهات */
.bk{display:flex;align-items:center;gap:12px;border-radius:var(--radius-card);padding:12px 14px;background:var(--honey);color:#5c460f}
.bk .tx{flex:1;font-size:14px;line-height:1.55}
.bk button{min-height:40px;border-radius:999px;border:0;background:#5c460f;color:#fff;font-weight:600;padding:0 14px;flex:0 0 auto}
.bk.red{background:var(--rose);color:#7d1f1a}.bk.red button{background:var(--rose-ink)}
.install{border-radius:var(--radius-card);padding:16px;background:var(--rose);color:#6e2a22;display:flex;flex-direction:column;gap:6px;font-size:14px}
.install ol{margin:0;padding-inline-start:20px;line-height:1.9}
.ribbon{display:flex;align-items:center;gap:12px;background:var(--honey);border-radius:var(--radius-card);padding:12px 14px;border:0;width:100%;text-align:start;color:var(--text)}
.ribbon .star{color:var(--honey-ink);display:flex;flex:0 0 auto}
.ribbon .star svg.ic{width:30px;height:30px;fill:var(--honey-bright);stroke:var(--honey-ink)}
.ribbon b{font-size:20px;color:var(--honey-ink)}

/* التقويم الشهري: في «مهامي» وفي لوحة الإضافة */
.calbox{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--lift);padding:12px;display:flex;flex-direction:column;gap:6px}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhd b{font-size:15.5px;text-align:center}
.calhd .h{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.calhd button{border:0;background:var(--raised);width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--brown);padding:0;flex:0 0 auto}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cgrid .wd{font-size:11px;color:var(--muted);padding-bottom:2px}
.cd{border:0;background:transparent;font-size:14px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;padding:0}
.cd.wk{color:#a89a8b}
.cd.past{color:#b9ad9f}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--brown-soft);font-weight:600}
.cd[aria-pressed=true]{background:var(--brown);color:#fff;box-shadow:none;font-weight:600}
.cd i{position:absolute;bottom:4px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--brown-soft)}
.cd[aria-pressed=true] i{background:var(--cream-hi)}
.selday{font-size:13.5px;color:var(--muted)}
.selday b{color:var(--text)}

/* ---------- التاريخ: محلي دائماً (توقيت الكويت) ولا يُستعمل toISOString حتى لا يقع الإدخال الليلي في الأمس ---------- */
function pad2(n){return (n<10?'0':'')+n;}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function today(){return ymd();}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function dow(s){return pd(s).getDay();}
function weekStart(s){return addDays(s,-dow(s));}
function fd(s){var x=pd(s);return DAYS[x.getDay()]+' '+x.getDate()+' '+MONTHS[x.getMonth()];}
function fdShort(s){var x=pd(s);return x.getDate()+' '+MONTHS[x.getMonth()];}
function relDay(s){var t=today();if(s===t)return 'اليوم';if(s===addDays(t,1))return 'غداً';if(s===addDays(t,-1))return 'أمس';var d=diffDays(t,s);if(d>1&&d<7)return DAYS[dow(s)];return fd(s);}
/* التاريخ الهجري للعرض فقط (تقويم أم القرى)، مع تصحيح ±١ يوم من الإعدادات ليوافق إعلان الكويت */
function hijri(s){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(pd(addDays(s,D.hijriAdj||0)));}catch(e){return '';}}
function nowHM(){var d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtT(t){if(!t)return '';var h=+t.slice(0,2),m=t.slice(3);return (h%12||12)+':'+m+(h<12?' ص':' م');}
/* العام الدراسي يبدأ في سبتمبر: الفصل الأول سبتمبر–يناير، والثاني فبراير–أغسطس */
function schoolYear(s){var d=pd(s);return d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;}
function termRange(k,s){var y=schoolYear(s||today());return k==='1'?[y+'-09-01',(y+1)+'-01-31']:k==='2'?[(y+1)+'-02-01',(y+1)+'-08-31']:[y+'-09-01',(y+1)+'-08-31'];}
function curTerm(){var m=pd(today()).getMonth();return m>=8||m===0?'1':'2';}

/* ---------- البيانات ---------- */

var D=null,DB=null,SAVE={ok:true},LSK='a3mali:data';

function load(){
  return idbOpen().then(function(db){DB=db;return new Promise(function(res){var q=db.transaction('kv').objectStore('kv').get('data');q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});})
  .catch(function(){DB=null;return null;})
  .then(function(d){if(!d){try{d=JSON.parse(localStorage.getItem(LSK)||'null');}catch(e){d=null;}}return d;});
}

  var copy=JSON.parse(JSON.stringify(D));
  if(DB){try{var tx=DB.transaction('kv','readwrite');tx.objectStore('kv').put(copy,'data');tx.oncomplete=function(){SAVE.ok=true;};tx.onerror=tx.onabort=function(){saveLS(copy);};return;}catch(e){}}

function norm(d){var b=blank();d=d||b;
  /* ترقية الإصدار الأول: التذكير يصير اختصار «تذكيرات» لأن ملف التقويم لم يعمل جيداً */
  if((d.v||1)<2){d.v=2;d.remind=Object.assign({},d.remind||{},{method:'sc',scOk:false});}
  /* ترقية الإصدار الثاني: «تذكيرات» تصير «التقويم» عبر الاختصار الجديد، ويلزم تثبيته مرة أخرى */
  if(d.v<3){d.v=3;var r0=d.remind||{};d.remind=Object.assign({},r0,{method:r0.method==='ics'?'ics':'cal',calOk:false,auto:true});delete d.remind.scOk;}
  ['profile','remind'].forEach(function(k){d[k]=Object.assign({},b[k],d[k]||{});});
  ['items','ach','notes','trash','rvSkip'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
  if(!Array.isArray(d.topics))d.topics=b.topics.slice();
  if(typeof d.review!=='string')d.review='';if(typeof d.hijriAdj!=='number')d.hijriAdj=0;
  /* سلة المحذوفات تحتفظ بما حُذف ٣٠ يوماً */
  var cut=Date.now()-30*864e5;d.trash=d.trash.filter(function(x){return (x.at||0)>cut;});return d;}

/* ---------- الحالة ---------- */
var UI={tab:'today',day:null,term:null,cat:null,q:'',sel:null,cal:null,tseg:'day',qf:'',capTxt:'',capDef:'today',nk:'f',nq:'',ntopic:''},RING={};
function item(id){return D.items.filter(function(x){return x.id===id;})[0];}
function achById(id){return D.ach.filter(function(x){return x.id===id;})[0];}
/* هل العنصر في هذا اليوم؟ المتكرر أسبوعياً يظهر في أيامه من تاريخ بدايته */
function onDay(it,s){if(it.rep)return it.rep.days.indexOf(dow(s))>=0&&s>=(it.rep.from||'0')&&(it.rep.skip||[]).indexOf(s)<0;return it.date===s;}
function isDone(it,s){return it.rep?(it.doneDates||[]).indexOf(s)>=0:!!it.done;}
function byTime(a,b){var ta=a.time||'99',tb=b.time||'99';return ta<tb?-1:ta>tb?1:(a.created||0)-(b.created||0);}
function dayItems(s){return D.items.filter(function(it){return it.type!=='habit'&&onDay(it,s);}).sort(byTime);}
function overdue(){var t=today();return D.items.filter(function(it){return !it.rep&&!it.done&&it.date&&it.date<t;}).sort(function(a,b){return a.date<b.date?-1:1;});}
function later(){return D.items.filter(function(it){return !it.rep&&!it.date&&!it.done;});}
/* «آخر موعد» يقترب: خلال ٣ أيام، والمهمة ليست مخططة اليوم */
function dueSoon(){var t=today();return D.items.filter(function(it){if(it.rep||it.done||!it.due)return false;return diffDays(t,it.due)<=3&&it.date!==t;}).sort(function(a,b){return a.due<b.due?-1:1;});}
/* الاجتماع القادم خلال أسبوعين، بعد الآن */
function nextMeet(){var t=today(),n=nowHM();for(var i=0;i<14;i++){var s=addDays(t,i),l=dayItems(s).filter(function(it){return it.type==='meet'&&!isDone(it,s)&&(i>0||!it.time||it.time>=n);});if(l.length)return {it:l[0],day:s};}return null;}
function untilTxt(s,t){if(s!==today())return relDay(s)+(t?' · '+fmtT(t):'');if(!t)return 'اليوم';var p=t.split(':'),now=new Date(),m=(+p[0]*60+ +p[1])-(now.getHours()*60+now.getMinutes());
  if(m<=0)return 'الآن';if(m<60)return 'بعد '+m+' دقيقة';var h=Math.floor(m/60),r=m%60;return 'بعد '+(h===1?'ساعة':h===2?'ساعتين':h+' ساعات')+(r>=10?' و'+r+' دقيقة':'')+' · '+fmtT(t);}
function achIn(r){return D.ach.filter(function(a){return a.date>=r[0]&&a.date<=r[1];});}
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function backupDays(){var b=D.lastBackup||D.created||Date.now();return Math.floor((Date.now()-b)/864e5);}
function hasData(){return D.items.length+D.ach.length>0;}
function hasAchFor(it,s){return D.ach.some(function(a){return a.from===it.id&&(!it.rep||a.date===s);});}
function reducedMotion(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}

/* ---------- أدوات ---------- */
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function plural(n,one,two,few,many){return n===1?one:n===2?two:n>=3&&n<=10?n+' '+few:n+' '+many;}

/* ---------- الشاشات ---------- */
/* الأولوية: «مهم وعاجل» وردي، و«مهم غير عاجل» عسلي، والعادي بلا تظليل؛ والاجتماع سماوي دائماً */
var PRI={ui:'مهم وعاجل',i:'مهم غير عاجل'};
function priCls(it){return it.type==='meet'?'s':it.pri==='ui'?'r':it.pri==='i'?'h':'';}
function dueTag(it){if(!it.due||(!it.rep&&it.done))return '';var n=diffDays(today(),it.due),c=n<0?'late':n<=2?'soon':'';
  var tx=n<0?'فات موعده '+(n===-1?'أمس':'منذ '+plural(-n,'يوم','يومين','أيام','يوماً')):n===0?'آخر موعد اليوم':n===1?'آخر موعد غداً':'باقي '+plural(n,'يوم','يومان','أيام','يوماً');
  return '<span class="tag '+c+'">'+IC.flag+tx+'</span>';}
function tmCell(t){if(!t)return '<span class="tm" aria-hidden="true"><b>—</b></span>';var h=+t.slice(0,2);return '<span class="tm"><b>'+(h%12||12)+':'+t.slice(3)+'</b><small>'+(h<12?'ص':'م')+'</small></span>';}
/* سطر في جدول اليوم: الساعة، ثم العنوان مظلَّلاً بلون أولويته، ثم علامة الإنجاز */
function itemRow(it,s){
  var dn=isDone(it,s),meet=it.type==='meet',hasAch=hasAchFor(it,s),st=it.steps||[],sd=st.filter(function(x){return x.d;}).length,pt=(it.points||[]).filter(function(x){return !x.d;}).length;
  var m=(meet?'<span class="tag meet">'+IC.meet+'اجتماع</span>':'')+(it.pri==='ui'&&!meet?'<span class="tag pri">مهم وعاجل</span>':'')+dueTag(it)+
    (st.length?'<span class="tag">'+IC.list+'<span class="num">'+sd+'/'+st.length+'</span></span>':'')+(pt?'<span class="tag meet">'+plural(pt,'نقطة','نقطتان','نقاط','نقطة')+'</span>':'')+
    (it.type==='habit'?'<span class="tag rtn">'+IC.rep+'روتيني'+(hStreak(it)?' · 🔥 <span class="num">'+hStreak(it)+'</span>':'')+'</span>':'')+(it.rep&&it.type!=='habit'?'<span class="tag">'+IC.rep+'أسبوعي</span>':'')+(it.cal?'<span class="tag cal">'+IC.bell+'في التقويم</span>':'')+(hasAch?'<span class="tag star">'+IC.star+'إنجاز</span>':'');

    (dn&&!hasAch&&it.type!=='habit'?'<button class="go" data-act="toach" data-id="'+it.id+'" data-day="'+s+'" aria-label="أضفه إلى إنجازاتي">'+IC.star+'</button>':'')+
    '<button class="ck" data-act="done" data-id="'+it.id+'" data-day="'+s+'" aria-label="'+(dn?'إلغاء الإنجاز':'أنجزت')+' '+esc(it.title)+'" aria-pressed="'+dn+'">'+(dn?IC.check:'')+'</button></div>';
}
function listOf(arr,s){var open=arr.filter(function(x){return !isDone(x,s);}),dn=arr.filter(function(x){return isDone(x,s);});return '<div class="list">'+open.concat(dn).map(function(it){return itemRow(it,s);}).join('')+'</div>';}
/* شريط التقدم: يمتلئ من آخر قيمة رآها المعلم إلى الحالية */
function barHtml(key,p){var to=Math.round(p*100),from=RING[key]===undefined?0:RING[key];RING[key]=to;return '<div class="bar" role="img" aria-label="'+to+'٪"><i style="--w:'+to+'%;--from:'+from+'%"></i></div>';}
/* مراجعة الأسبوع: من الخميس ظهراً إلى السبت، تعرض ما أُنجز ولم يُسجَّل إنجازاً */
function reviewDue(){var t=today(),d=dow(t);if(D.review===weekStart(t))return false;return d===5||d===6||(d===4&&nowHM()>='12:00');}
function weekDone(){var t=today(),w0=weekStart(t),out=[];
  D.items.forEach(function(it){if(it.type==='habit')return;if(it.rep){(it.doneDates||[]).forEach(function(s){if(s>=w0&&s<=t&&!hasAchFor(it,s))out.push({it:it,s:s});});}
    else if(it.done&&it.doneAt&&ymd(new Date(it.doneAt))>=w0&&!hasAchFor(it,it.date||t))out.push({it:it,s:ymd(new Date(it.doneAt))});});
  return out.filter(function(x){return D.rvSkip.indexOf(x.it.id+'@'+x.s)<0;});}
function greet(){var h=new Date().getHours();return h<12?'صباح الخير':'مساء الخير';}
function shortName(){var n=(D.profile.name||'').trim().split(/\s+/);return n[0]?(/^(أ|د|م)\.?$/.test(n[0])&&n[1]?n[0]+' '+n[1]:n[0]):'';}
function initial(){var n=(D.profile.name||'').replace(/^(أ|د|م)\.\s*/,'').trim();return n?esc(n.charAt(0)):IC.user;}

function quadOf(l,s){var o=l.filter(function(x){return !isDone(x,s);});
  return {ui:o.filter(function(x){return x.pri==='ui';}),i:o.filter(function(x){return x.pri==='i';}),done:l.filter(function(x){return isDone(x,s);}),n:o.filter(function(x){return !x.pri;})};}
function vToday(){
  var t=today(),s=UI.day||t,ws=weekStart(s),strip='',name=shortName();
  /* في الجمعة والسبت يعرض الشريط الأسبوع الدراسي القادم */
  if(!UI.day&&dow(t)>=5)ws=addDays(ws,7);
  for(var i=0;i<5;i++){var d=addDays(ws,i),has=dayItems(d).some(function(x){return !isDone(x,d);});
    strip+='<button class="d'+(d===t?' today':'')+'" data-act="day" data-d="'+d+'" aria-pressed="'+(d===s)+'"><span>'+DSHORT[i]+'</span><b class="num">'+pd(d).getDate()+'</b><i class="'+(has?'on':'')+'"></i></button>';}
  /* الأعمال والروتين معاً: جدول اليوم يجمعهما مرتبين بالساعة */
  var l=dayItems(s),hl=habitsOn(s),all=l.concat(hl),dn=all.filter(function(x){return isDone(x,s);}).length,left=all.length-dn,hs=allStreak(),hb=habits().length;
  var h='<div class="hello"><div><h1>'+greet()+(name?'، '+esc(name):'')+' 👋</h1><div class="d">'+fd(s)+' · '+hijri(s)+'</div></div><button class="av" data-act="tab" data-id="more" aria-label="المزيد وبياناتي">'+initial()+'</button></div>';
  h+='<div class="days"><button class="w" data-act="wk" data-d="-7" aria-label="الأسبوع السابق">›</button>'+strip+'<button class="w" data-act="wk" data-d="7" aria-label="الأسبوع التالي">‹</button></div>';

function openAch(id){var a=achById(id);if(!a)return;ED={id:id,type:'ach',title:a.title,date:a.date,cat:a.cat,role:a.role||'منفّذ',note:a.note||'',from:a.from,pin:!!a.pin,auto:{}};editSheet();}
/* حفظ الخطوات والنقاط فوراً للعنصر الموجود، حتى لا يلزم «حفظ» لكل علامة */
function syncLists(){if(!ED||!ED.id||ED.type==='ach')return;var it=item(ED.id);if(!it)return;it.steps=JSON.parse(JSON.stringify(ED.steps));it.points=JSON.parse(JSON.stringify(ED.points));save();}
/* فهم النص: «اليوم» «غداً/بكرة» «بعد غد» وأسماء الأيام، والوقت «10:30» أو «الساعة 10»،
   و«قبل الخميس» آخر موعد، و«بعد الدوام/الليلة/مساءً»، والخطوات بعد نقطتين: «تصحيح: ١١/١، ١١/٣» */
function dayWord(w){var t=today();if(w==='اليوم')return t;if(/^(غدا|غداً|بكرة|باكر)$/.test(w))return addDays(t,1);var i=DAYS.indexOf(w.replace(/^يوم\s+/,''));if(i>=0){var k=(i-dow(t)+7)%7||7;return addDays(t,k);}return null;}
var DAYRE='(اليوم|غداً|غدا|بكرة|باكر|(?:يوم\\s+)?(?:'+DAYS.join('|')+'))';
var EVERE=/(^|\s)(بعد الدوام|الليلة|مساءً|مساء|في المساء)(?=\s|$)/;
function parseTitle(t){var r={},td=today(),m;
  if((m=t.match(new RegExp('قبل\\s+'+DAYRE+'(?=\\s|$)'))))r.due=dayWord(m[1]);
  var rest=t.replace(new RegExp('قبل\\s+'+DAYRE),' ');
  if(/بعد\s*(غد|بكرة)/.test(rest))r.date=addDays(td,2);
  else if((m=rest.match(new RegExp('(^|\\s)'+DAYRE+'(?=\\s|$)'))))r.date=dayWord(m[2]);
  if((m=rest.match(/(\d{1,2}):(\d{2})/)))r.time=pad2(+m[1])+':'+m[2];
  else if((m=rest.match(/الساعة\s*(\d{1,2})/))){var hh=+m[1];if(hh<7)hh+=12;r.time=pad2(hh)+':00';}
  if(EVERE.test(rest))r.eve=true;
  if(/^اجتماع/.test(t.trim()))r.type='meet';
  if((m=t.match(/^([^:]{2,60}):\s*(.+)$/))&&/[،,]/.test(m[2]))r.steps=m[2].split(/[،,]/).map(function(x){return x.trim();}).filter(Boolean);
  return r;}
/* بعد الفهم تُحذف الكلمات المفهومة من العنوان: «اجتماع القسم الأحد الساعة 10» ← «اجتماع القسم» */
function cleanTitle(t,e){var p=parseTitle(t);
  if(p.steps&&e.steps.length)t=t.replace(/:\s*.+$/,'');
  if(p.due&&p.due===e.due)t=t.replace(new RegExp('قبل\\s+'+DAYRE+'(?=\\s|$)'),' ');
  if(p.date&&p.date===e.date)t=t.replace(/بعد\s*(غد|بكرة)/,' ').replace(new RegExp('(^|\\s)'+DAYRE+'(?=\\s|$)'),' ');
  if(p.time&&p.time===e.time)t=t.replace(/(الساعة\s*)?\d{1,2}:\d{2}/,' ').replace(/الساعة\s*\d{1,2}/,' ');
  if(p.eve&&e.eve)t=t.replace(EVERE,' ');
  t=t.replace(/\s+/g,' ').trim();return t||e.title.trim();}

/* ---------- التقاط مهامي: كل سطر من نص ملصوق يصير مهمة ---------- */
function westDigits(s){return s.replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);});}
function capParse(txt,def){var t=today();
  return txt.split(/\n+/).map(function(l){return westDigits(l).replace(/^\s*([-–—•*·▪◦✓✔☐]|\d{1,2}\s*[.\-)]|\(\d{1,2}\))\s*/,'').trim();}).filter(function(l){return l.length>=2;}).slice(0,30).map(function(l){
    var p=parseTitle(l),o={title:l,date:p.date||null,time:p.time||null,due:p.due||null,eve:!!p.eve,steps:[]};o.title=cleanTitle(l,o);
    o.type=p.type==='meet'?'meet':'task';if(!o.date&&(def==='today'||o.type==='meet'))o.date=t;return o;});}
function capSheet(){var txt=UI.capTxt||'',l=capParse(txt,UI.capDef||'today');
  layer('<div class="row"><h2>التقاط مهامي</h2><button class="btn plain" data-act="closel">إغلاق</button></div>'+
    '<p class="small dim">الصق رسالة رئيس القسم أو قائمة. كل سطر يصير مهمة، ويُفهم منه اليوم والساعة مثل «غداً» و«الأحد» و«الساعة 10». لنص في صورة: المس النص في الصورة مطوّلاً ثم «نسخ»، ثم الصقه هنا.</p>'+
    '<textarea class="field" id="capin" data-capin="1" rows="6" placeholder="مثال:\nتسليم أسئلة الاختبار الأحد\nاجتماع القسم الثلاثاء الساعة 9:40\nرفع الدرجات قبل الخميس">'+esc(txt)+'</textarea>'+
    '<span class="lbl">ما ليس فيه يوم</span><div class="seg"><button data-act="capdef" data-k="today" aria-pressed="'+((UI.capDef||'today')==='today')+'">لليوم</button><button data-act="capdef" data-k="none" aria-pressed="'+(UI.capDef==='none')+'">بلا موعد</button></div>'+
    '<div id="capres">'+capPreview(l)+'</div>'+
    '<button class="btn pri" data-act="capsave" id="capbtn"'+(l.length?'':' disabled')+'>'+(l.length?'أضف '+plural(l.length,'مهمة واحدة','مهمتين','مهام','مهمة'):'الصق نصاً أولاً')+'</button>',true);}
function capPreview(l){return l.length?'<div class="capl">'+l.map(function(o){return '<div><span>'+(o.type==='meet'?'اجتماع: ':'')+esc(o.title)+'</span><small>'+(o.date?relDay(o.date):'بلا موعد')+(o.time?' · '+fmtT(o.time):'')+(o.due?' · قبل '+DAYS[dow(o.due)]:'')+'</small></div>';}).join('')+'</div>':'';}

/* ---------- التنبيه في تقويم الآيفون ----------
   الطريقة الأولى (الموصى بها): اختصار «a3mali-taqweem» يستقبل أربعة أسطر: بداية الموعد ونهايته ووقت المنبّه
   (بالصيغة القياسية yyyy-MM-ddTHH:mm:00، لأنها تُقرأ صحيحة مهما كانت لغة الهاتف) ثم العنوان،
   فيضيف حدثاً بمنبّه إلى تطبيق «التقويم». الاسم لاتيني لأن الأسماء العربية قد تُخزَّن مفكوكة الحروف فلا تطابق.
   الطريقة الثانية: ملف تقويم .ics بمنبّه. */
var SC_NAME='a3mali-taqweem';
function nextOcc(it){if(!it.rep)return it.date||it.due;var t=today();for(var i=0;i<14;i++){var s=addDays(t,i);if(onDay(it,s)&&(i>0||!it.time||it.time>=nowHM()))return s;}return null;}
function alertAt(it){function at(d){var t=it.time||'07:00',p=t.split(':'),x=pd(d);x.setHours(+p[0],+p[1]-(it.time?(D.remind.lead||0):0),0,0);return x;}
  var d=nextOcc(it);if(!d)return null;var x=at(d);
  /* مهمة بلا وقت مضى صباحها ولها آخر موعد قادم: التنبيه صباح آخر موعد */
  if(x<new Date()&&!it.rep&&it.due&&it.due>d){var y=pd(it.due);y.setHours(7,0,0,0);if(y>new Date())return y;}
  return x;}
function isoL(d){return ymd(d)+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())+':00';}
/* نص الاختصار: البداية، والنهاية، والمنبّه، والعنوان */
function calText(it){var a=alertAt(it);if(!a)return null;var s;
  if(it.time){var p=it.time.split(':');s=pd(nextOcc(it));s.setHours(+p[0],+p[1],0,0);}else s=new Date(a);
  var e=new Date(s.getTime()+(it.type==='meet'?60:it.time?30:15)*60000);
  return isoL(s)+'\n'+isoL(e)+'\n'+isoL(a)+'\n'+String(it.title).replace(/\n/g,' ');}
function calUrl(text){return 'shortcuts://run-shortcut?name='+encodeURIComponent(SC_NAME)+'&input=text&text='+encodeURIComponent(text);}
/* الآيفون لا يفتح «الاختصارات» برمجياً من البرنامج المضاف إلى الشاشة الرئيسية، فيُعرض رابط حقيقي يلمسه المعلم بنفسه */
function calSend(id,text,title,when){layer('<div class="row"><h2>نبّهني في تقويم الآيفون</h2><button class="btn plain" data-act="closel">لاحقاً</button></div>'+
  '<p><b>'+esc(title)+'</b><br><span class="small dim">يرنّ '+when+'</span></p>'+
  '<a class="btn pri" href="'+calUrl(text)+'" data-act="calsent" data-id="'+(id||'')+'" data-when="'+esc(when)+'">'+IC.bell+' أضف التنبيه إلى التقويم</a>'+
  '<p class="small dim">يُفتح تطبيق «الاختصارات» لحظةً ويضيف الموعد بمنبّه، ثم ارجع إلى «أعمالي». أول مرة يسألك الآيفون عن الوصول إلى «التقويم»: اختر «السماح دائماً».</p>'+
  '<button class="btn plain" data-act="calsetup">لم يُفتح شيء أو قال إن الاختصار غير موجود؟ ثبّته من جديد</button>');}
function calKey(it){return (nextOcc(it)||'')+' '+(it.time||'')+' '+(D.remind.lead||0);}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsDT(d,t){return d.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'');}
function icsFor(it){var d=nextOcc(it);if(!d)return null;var lead=D.remind.lead||0,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//a3mali//AR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+it.id+'@a3mali','DTSTAMP:'+icsDT(ymd(),nowHM())];
  if(it.time){var p=it.time.split(':'),e=new Date(pd(d));e.setHours(+p[0],+p[1]+(it.type==='meet'?60:30));L.push('DTSTART:'+icsDT(d,it.time),'DTEND:'+icsDT(ymd(e),pad2(e.getHours())+':'+pad2(e.getMinutes())));}
  else L.push('DTSTART;VALUE=DATE:'+icsDT(d),'DTEND;VALUE=DATE:'+icsDT(addDays(d,1)));
  if(it.rep)L.push('RRULE:FREQ=WEEKLY;BYDAY='+it.rep.days.map(function(i){return ['SU','MO','TU','WE','TH','FR','SA'][i];}).join(','));
  L.push('SUMMARY:'+icsEsc(it.title));if(it.note)L.push('DESCRIPTION:'+icsEsc(it.note));
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.title),'TRIGGER:'+(it.time?(lead?'-PT'+lead+'M':'PT0M'):'PT7H'),'END:VALARM','END:VEVENT','END:VCALENDAR');
  return L.join('\r\n')+'\r\n';}
function calSteps(){return '<ol class="stepsl"><li>المس زر التثبيت، ثم «تنزيل».</li><li>افتح «التنزيلات» (سهم التنزيل في سفاري أو تطبيق «الملفات») والمس الملف، ثم «إضافة اختصار».</li><li>أول موعد يسألك الآيفون: السماح للاختصار بالوصول إلى «التقويم» — اختر «السماح دائماً».</li><li>إن قالت «الاختصارات» إن الاختصار غير موجود فأعد الخطوة الأولى. واحذف الاختصار القديم «تذكير عملي» إن وُجد.</li></ol>';}
function calSetup(it){layer('<div class="row"><h2>التنبيه في تقويم الآيفون</h2><button class="btn plain" data-act="closel">إغلاق</button></div>'+
  '<p>لكي يرنّ الآيفون في وقت الموعد ولو كان «أعمالي» مغلقاً، يرسل البرنامج الموعد إلى تطبيق «التقويم» عبر اختصار صغير اسمه «'+SC_NAME+'». تثبّته مرة واحدة:</p>'+
  '<a class="btn soft" href="'+SC_NAME+'.shortcut" target="_blank" rel="noopener">١. تثبيت اختصار «'+SC_NAME+'»</a>'+calSteps()+
  '<button class="btn pri" data-act="calgo" data-id="'+(it?it.id:'')+'">٢. ثبّتّه — أرسل الموعد الآن</button>'+
  '<p class="small dim">بعد إضافة الموعد ارجع إلى «أعمالي» بزر الرجوع أعلى الشاشة.</p>');}
function remind(it){
  var w=alertAt(it);if(!w){refuse('حدّد موعداً أو آخر موعد أولاً');return false;}
  if(w<new Date()){refuse('وقت التنبيه مضى — اختر موعداً قادماً');return false;}
  if(D.remind.method==='cal'){if(!D.remind.calOk){calSetup(it);return false;}calSend(it.id,calText(it),it.title,relDay(ymd(w))+' '+fmtT(pad2(w.getHours())+':'+pad2(w.getMinutes())));return false;}
  shareFile((it.title.slice(0,30).replace(/[\/\\:*?"<>|]+/g,'-')||'موعد')+'.ics',icsFor(it),'text/calendar').then(function(ok){if(ok){it.cal=calKey(it);save();toast('اختر «إضافة» في التقويم ليرنّ في وقته');}});return true;
}

/* ---------- فوائدي: فوائد وأفكار ويوميات، كتابةً أو صوتاً أو صورةً أو نصاً من صورة ----------
   التدوين: {id, kind: f فائدة | i فكرة | y يوميات, title, text, topic (للفوائد), src, method: w|v|p|o, date, time, created, media[{id,type:audio|image,dur}], task}
   الصوت والصور في مخزن IndexedDB مستقل اسمه media ({t: نوع الملف, b: ArrayBuffer})، ولا تغادر الهاتف إلا في النسخة الاحتياطية. */
var NK={f:['فائدة','فوائد','الفائدة'],i:['فكرة','أفكار','الفكرة'],y:['يوميات','يوميات','اليوميات']};
var NM={w:['كتابة','بلوحة المفاتيح'],v:['تسجيل صوتي','يُحفظ صوتك'],p:['تصوير','صورة تُحفظ'],o:['نص من صورة','من كتاب أو سبورة']};
var NE=null,REC=null,PLAY=null,MURL={};
IC.bulb=svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>');

var NKI={f:IC.bulb,i:IC.spark,y:IC.diary},NMI={w:IC.pen,v:IC.mic,p:IC.cam,o:IC.scan};
function noteById(id){return D.notes.filter(function(x){return x.id===id;})[0];}
function mmss(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+pad2(s%60);}

/* المخزن: الوسائط تُحفظ ArrayBuffer مع نوعها، لأنه أضمن من Blob في سفاري القديم */
function mediaTx(mode,fn){return new Promise(function(res,rej){if(!DB||!DB.objectStoreNames.contains('media')){rej(new Error('nodb'));return;}
  try{var tx=DB.transaction('media',mode),st=tx.objectStore('media'),out=fn(st);tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:out);};tx.onerror=tx.onabort=function(){rej(tx.error);};}catch(e){rej(e);}});}
function blobBuf(b){return b.arrayBuffer?b.arrayBuffer():new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result);};f.readAsArrayBuffer(b);});}
function mediaPut(id,blob){return blobBuf(blob).then(function(buf){return mediaTx('readwrite',function(st){st.put({t:blob.type,b:buf},id);});});}
function mediaGet(id){return mediaTx('readonly',function(st){return st.get(id);}).then(function(v){return v?new Blob([v.b],{type:v.t}):null;});}
function mediaKeys(){return mediaTx('readonly',function(st){return st.getAllKeys();});}
function mediaDel(id){return mediaTx('readwrite',function(st){st.delete(id);});}
function mediaUrl(id){if(MURL[id])return Promise.resolve(MURL[id]);return mediaGet(id).then(function(b){if(!b)return null;MURL[id]=URL.createObjectURL(b);return MURL[id];});}
/* الوسائط التي لم يعد يشير إليها تدوين ولا محذوف تُحذف عند الفتح */
function mediaRefs(){var r={};D.notes.concat(D.trash.filter(function(t){return t.kind==='note';}).map(function(t){return t.obj;})).forEach(function(n){(n.media||[]).forEach(function(m){r[m.id]=1;});});return r;}
function mediaClean(){var r=mediaRefs();mediaKeys().then(function(ks){(ks||[]).forEach(function(k){if(!r[k])mediaDel(k).catch(function(){});});}).catch(function(){});}
/* الصور والتسجيلات تظهر بعد الرسم، حين تُقرأ من المخزن */
function hydrate(root){(root||document).querySelectorAll('img[data-mid]').forEach(function(im){var id=im.dataset.mid;mediaUrl(id).then(function(u){if(u&&im.isConnected)im.src=u;}).catch(function(){});});}
/* تصغير الصورة إلى ١٦٠٠ نقطة: تكفي لقراءة النص فيها، وتوفّر المساحة */
function shrinkImage(file){return new Promise(function(res){var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var s=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b||file);},'image/jpeg',.82);};
  im.onerror=function(){URL.revokeObjectURL(u);res(file);};im.src=u;});}

/* ---------- الشاشة ---------- */
function audioRow(m,label){return '<div class="audio"><button class="play'+(PLAY&&PLAY.id===m.id&&!PLAY.a.paused?' on':'')+'" data-act="nplay" data-mid="'+m.id+'" aria-label="تشغيل '+esc(label||'التسجيل')+'">'+(PLAY&&PLAY.id===m.id&&!PLAY.a.paused?IC.pause:IC.play)+'</button><span class="wave" aria-hidden="true">'+waveBars(m.id)+'</span><small class="num">'+mmss(m.dur)+'</small></div>';}
function waveBars(seed){var h='',n=0;for(var i=0;i<seed.length;i++)n+=seed.charCodeAt(i);for(var j=0;j<24;j++){h+='<i style="height:'+(22+Math.abs(Math.sin(j*1.7+n))*78).toFixed(0)+'%"></i>';}return h;}
function noteCard(n){var med=n.media||[],img=med.filter(function(m){return m.type==='image';})[0],aud=med.filter(function(m){return m.type==='audio';})[0],t=today();
  var when=n.kind==='y'?fmtT(n.time||''):(n.date===t?'اليوم':relDay(n.date));
  return '<div class="note k'+n.kind+'"><button class="nb" data-act="nedit" data-id="'+n.id+'"><span class="hd"><span class="src">'+NMI[n.method||'w']+NM[n.method||'w'][0]+'</span>'+(n.topic?'<span>'+esc(n.topic)+'</span>':'')+'<span class="dt">'+when+'</span></span>'+
    (n.title?'<b>'+esc(n.title)+'</b>':'')+(n.text?'<p>'+esc(n.text.length>220?n.text.slice(0,220)+'…':n.text)+'</p>':'')+'</button>'+

function recStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){refuse('التسجيل غير متاح هنا — حدّث الآيفون أو افتح البرنامج من الأيقونة');return;}
  if(PLAY){PLAY.a.pause();PLAY=null;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].filter(function(t){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t);})[0];
    var mr=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st),ch=[],r={mr:mr,st:st,t0:Date.now(),ch:ch};REC=r;
    mr.ondataavailable=function(ev){if(ev.data&&ev.data.size)ch.push(ev.data);};
    mr.onstop=function(){st.getTracks().forEach(function(t){t.stop();});if(r.ac)try{r.ac.close();}catch(e){}clearInterval(r.iv);var dur=(Date.now()-r.t0)/1000;REC=null;
      if(r.discard||!NE)return;NE.pend={kind:'audio',blob:new Blob(ch,{type:(mr.mimeType||mt||'audio/mp4').split(';')[0]}),dur:Math.round(dur)};noteSheet(true);};
    try{var AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),an=ac.createAnalyser();an.fftSize=64;ac.createMediaStreamSource(st).connect(an);r.ac=ac;r.an=an;r.buf=new Uint8Array(an.frequencyBinCount);}catch(e){}
    mr.start(1000);noteSheet(true);
    r.iv=setInterval(function(){var t=document.getElementById('rtime');if(t)t.textContent=mmss((Date.now()-r.t0)/1000);
      var bars=document.querySelectorAll('#rbars i');if(r.an&&bars.length){r.an.getByteFrequencyData(r.buf);for(var i=0;i<bars.length;i++){var v=r.buf[i%r.buf.length]/255;bars[i].style.height=Math.round(12+v*88)+'%';}}
      if(Date.now()-r.t0>15*60000)recStop();},120);
  }).catch(function(){refuse('لم يُسمح بالميكروفون — فعّله لـ«أعمالي» من إعدادات الآيفون');});}
function recStop(){if(REC&&REC.mr.state!=='inactive')REC.mr.stop();}
function recCancel(){if(REC){REC.discard=true;recStop();}}

function playBlobUrl(id,url){if(PLAY&&PLAY.id===id){if(PLAY.a.paused)PLAY.a.play();else PLAY.a.pause();return;}
  if(PLAY)PLAY.a.pause();var a=new Audio(url);PLAY={id:id,a:a};a.onended=a.onpause=a.onplay=function(){if(NE)noteSheet(true);else if(UI.tab==='notes')render(true);};a.play().catch(function(){refuse('تعذّر تشغيل التسجيل');});}

  if(a==='nsave'){var e=NE,ti=(e.title||'').trim(),tx=(e.text||'').trim(),keepP=e.pend&&!(e.method==='o'&&!e.keepImg);

    var o=e.id?noteById(e.id):{id:uid(),created:Date.now(),date:today(),time:nowHM(),method:e.method,media:[]};
    Object.assign(o,{kind:e.kind,title:ti,text:tx,topic:e.kind==='f'?(e.topic||''):'',src:e.kind!=='y'?(e.src||'').trim():'',media:e.media.slice()});
    var p=Promise.resolve(),mid2=uid();
    if(keepP)p=mediaPut(mid2,e.pend.blob).then(function(){o.media.push({id:mid2,type:e.pend.kind,dur:e.pend.dur||0});});
    p.then(function(){if(!e.id)D.notes.push(o);if(PLAY){PLAY.a.pause();PLAY=null;}closeLayer();UI.tab='notes';UI.nk=o.kind;render(true);save();toast(e.id?'حُفظ التعديل':'حُفظت '+NK[o.kind][2]);})
     .catch(function(){refuse('تعذّر حفظ '+(e.pend&&e.pend.kind==='audio'?'التسجيل':'الصورة')+' على الهاتف');});
    return false;}
  if(a==='ndel'){var dn=noteById(b.dataset.id);if(!dn)return false;var di=D.notes.indexOf(dn);D.notes.splice(di,1);trash('note',dn);closeLayer();render(true);
    toast('حُذف التدوين',function(){D.notes.splice(di,0,dn);D.trash=D.trash.filter(function(t){return t.obj!==dn;});});return true;}
  if(a==='note2task'){var nn=noteById(b.dataset.id);if(!nn)return false;var tk={id:uid(),type:'task',title:nn.title||(nn.text||'فكرة').split('\n')[0].slice(0,80),date:null,time:null,note:nn.text||'',rep:null,done:false,created:Date.now(),eve:false,due:null,pri:'i',steps:[],points:[],from:nn.id};
    D.items.push(tk);nn.task=tk.id;render(true);toast('صارت مهمة في «بلا موعد»',function(){UI.tab='tasks';UI.tseg='all';},false,'افتح');return true;}
  return null;}

/* النسخة الاحتياطية تحمل الصور والتسجيلات نصاً (data URL)، ليُستعاد كل شيء على هاتف جديد */
function mediaForBackup(){var r=mediaRefs(),out={},ids=Object.keys(r);
  return ids.reduce(function(p,id){return p.then(function(){return mediaGet(id).then(function(b){if(!b)return;return new Promise(function(res){var f=new FileReader();f.onload=function(){out[id]=f.result;res();};f.readAsDataURL(b);});}).catch(function(){});});},Promise.resolve()).then(function(){return out;});}
/* تحويل data URL إلى Blob يدوياً، لأن سياسة الأمان تمنع fetch لروابط data */
function dataUrlBlob(u){var i=u.indexOf(','),meta=u.slice(5,i),bin=atob(u.slice(i+1)),arr=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);return new Blob([arr],{type:meta.split(';')[0]});}
function mediaRestore(m){return Object.keys(m||{}).reduce(function(p,id){return p.then(function(){try{return mediaPut(id,dataUrlBlob(m[id])).catch(function(){});}catch(e){}});},Promise.resolve());}

function shareFile(name,body,mime){
  var f=null;try{f=new File([body],name,{type:mime});}catch(e){}
  function download(){var u=URL.createObjectURL(new Blob([body],{type:mime}));var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);return true;}
  if(f&&navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(function(){return true;},function(e){return e&&e.name==='AbortError'?false:download();});}catch(e){}}
  return Promise.resolve(download());
}

/* ---------- محرك PDF ---------- */
var PDFX=2;/* دقة الرسم: ضعف مقاس الورقة (قرابة ١٩٢ نقطة في البوصة) */
function pgNew(land){var c=document.createElement('canvas'),W=land?1123:794,H=land?794:1123;c.width=W*PDFX;c.height=H*PDFX;c.dir='rtl';
  var x=c.getContext('2d');x.scale(PDFX,PDFX);x.fillStyle='#fff';x.fillRect(0,0,W,H);try{x.direction='rtl';}catch(e){}x.textBaseline='middle';return {c:c,x:x,W:W,H:H,land:land};}
function pgFont(g,w,s){g.x.font=w+' '+s+'px "Readex Pro","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif';}
/* النص يُحاط بعلامتي اتجاه من اليمين إلى اليسار حتى لا ينقلب ترتيب العربي مع الأرقام */
function pgRtl(t){return '‫'+String(t)+'‬';}
function pgW(g,t){return g.x.measureText(pgRtl(t)).width;}
/* كتابة سطر: a محاذاة (right / center / left)، ويُصغَّر الخط إن زاد النص عن العرض mw */
function pgText(g,t,x,y,a,col,w,s,mw){pgFont(g,w,s);while(mw&&s>8&&pgW(g,t)>mw){s-=.5;pgFont(g,w,s);}
  g.x.fillStyle=col||'#1b1b1b';g.x.textAlign=a||'right';g.x.fillText(pgRtl(t),x,y);}
/* تقسيم نص إلى أسطر لا يزيد كل منها عن العرض mw */
function pgWrap(g,t,w,s,mw){pgFont(g,w,s);var out=[],line='';String(t).split(/\s+/).forEach(function(wd){var tr=line?line+' '+wd:wd;if(line&&pgW(g,tr)>mw){out.push(line);line=wd;}else line=tr;});if(line)out.push(line);return out;}
function pgBox(g,x,y,w,h,fill,line){if(fill){g.x.fillStyle=fill;g.x.fillRect(x,y,w,h);}if(line!==false){g.x.strokeStyle=line||'#cfcfc8';g.x.lineWidth=1;g.x.strokeRect(x+.5,y+.5,w,h);}}
/* خلية جدول: نص في الوسط (أو على اليمين) وقد يكون عدة أسطر */
function pgCell(g,x,y,w,h,t,o){o=o||{};pgBox(g,x,y,w,h,o.bg,o.line);if(t===''||t==null)return;
  var s=o.s||13,wt=o.w||400,lines=o.wrap?pgWrap(g,t,wt,s,w-8):[String(t)],lh=s*1.3,y0=y+h/2-(lines.length-1)*lh/2;
  lines.forEach(function(l,i){if(o.right)pgText(g,l,x+w-7,y0+i*lh,'right',o.col,wt,s,w-12);else pgText(g,l,x+w/2,y0+i*lh,'center',o.col,wt,s,w-6);});}
function pgFoot(g,i,n){if(n>1)pgText(g,'صفحة '+(i+1)+' من '+n,g.W/2,g.H-34,'center','#777',400,12);}
/* تحت الجدول: اسم المعلم وتوقيعه في اليمين، ورئيس القسم وتوقيعه في يسار الصفحة */
var SIGN_H=30;
function pgSign(g,y,L,R){var dots='....................';
  pgText(g,'اسم المعلم: '+teacherName(),R,y,'right','#1b1b1b',600,11.5,(R-L)/2-20);pgText(g,'التوقيع: '+dots,R,y+19,'right','#444',400,10.5);
  /* كتلة رئيس القسم تبدأ من يسار الصفحة، وسطراها يبدآن من النقطة نفسها على اليمين */
  pgFont(g,600,11.5);var bw=pgW(g,'رئيس القسم: '+dots);pgFont(g,400,10.5);bw=Math.max(bw,pgW(g,'التوقيع: '+dots));
  pgText(g,'رئيس القسم: '+dots,L+bw,y,'right','#1b1b1b',600,11.5);pgText(g,'التوقيع: '+dots,L+bw,y+19,'right','#444',400,10.5);}

/* جمع الصفحات في ملف PDF: كل صفحة صورة JPEG بمقاس A4 كامل */
function pdfBytes(pages){
  var parts=[],len=0,offs=[],n=pages.length,tot=3+n*3;
  function add(x){if(typeof x==='string'){var u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i)&255;x=u;}parts.push(x);len+=x.length;}
  function obj(k,body){offs[k]=len;add(k+' 0 obj\n');body.forEach(add);add('\nendobj\n');}
  function jpg(c){var d=atob(c.toDataURL('image/jpeg',.9).split(',')[1]),u=new Uint8Array(d.length);for(var i=0;i<d.length;i++)u[i]=d.charCodeAt(i);return u;}
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids ['+pages.map(function(p,i){return (3+i*3)+' 0 R';}).join(' ')+'] /Count '+n+' >>']);
  pages.forEach(function(p,i){var b=3+i*3,w=p.land?841.89:595.28,h=p.land?595.28:841.89,img=jpg(p.c),cs='q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q';
    var iw=p.c.width,ih=p.c.height;p.c.width=p.c.height=0;/* تحرير ذاكرة اللوحة بعد ترميزها */
    obj(b,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im0 '+(b+2)+' 0 R >> >> /Contents '+(b+1)+' 0 R >>']);
    obj(b+1,['<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream']);
    obj(b+2,['<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n',img,'\nendstream']);});
  var xr=len;add('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(var k=1;k<tot;k++)add(('0000000000'+offs[k]).slice(-10)+' 00000 n \n');
  add('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  var out=new Uint8Array(len),o=0;parts.forEach(function(p){out.set(p,o);o+=p.length;});return out;
}

/* تقرير الإنجازات لرئيس القسم: بيانات المعلم، وعدد الإنجازات لكل تصنيف، وأبرز الإنجازات، ثم جدول مجمّع بالتصنيف، ثم التوقيعات */
/* معيّن ذهبي صغير (من نقش السدو) علامةً للإنجاز المثبّت في التقرير */
function pgGem(g,x,y,r,c){g.x.fillStyle=c;g.x.beginPath();g.x.moveTo(x,y-r);g.x.lineTo(x+r,y);g.x.lineTo(x,y+r);g.x.lineTo(x-r,y);g.x.closePath();g.x.fill();}

function pdfAch(k){
  var r=termRange(k),list=achIn(r).sort(function(a,b){return a.date<b.date?-1:1;}),y=schoolYear(today());
  var pages=[],g=pgNew(false),L=40,R=754,W=R-L,yy;

  pgText(g,(k==='1'?'الفصل الدراسي الأول':k==='2'?'الفصل الدراسي الثاني':'العام الدراسي كاملاً')+' '+y+'/'+(y+1)+' · من '+fdShort(r[0])+' '+pd(r[0]).getFullYear()+' إلى '+fdShort(r[1])+' '+pd(r[1]).getFullYear(),g.W/2,94,'center','#555',400,13.5);

  pgText(g,'المدرسة: '+(D.profile.school||'—'),R-14,158,'right','#1b2422',400,14,W/2-20);pgText(g,'عدد الإنجازات: '+list.length,L+W/2-10,158,'right','#1b2422',600,14);
  /* مربعات التصنيفات العشرة */

  CATS.forEach(function(c,i){var col=i%5,row=Math.floor(i/5),x=R-(col+1)*cw-col*8,y0=192+row*(ch+8),n=list.filter(function(a){return a.cat===i;}).length;
    pgBox(g,x,y0,cw,ch,n?'#ffffff':'#faf8f3',n?COL[i]:'#e3d9c4');g.x.fillStyle=COL[i];g.x.fillRect(x+cw-5,y0,5,ch);
    pgText(g,String(n),x+cw-14,y0+20,'right',n?COL[i]:'#999',700,18);pgCell(g,x,y0+30,cw-6,24,CSHORT[i],{line:false,s:10.5,w:500,col:n?'#333':'#888'});});
  yy=192+2*(ch+8)+18;
  if(!list.length){pgText(g,'لا إنجازات مسجّلة في هذه الفترة.',R,yy+10,'right','#555',400,15);yy+=40;}
  /* أبرز الإنجازات: ما ثبّته المعلم، في أول التقرير */
  var pins=list.filter(function(a){return a.pin;});
  if(pins.length){yy+=6;g.x.fillStyle='#9a7418';g.x.fillRect(L,yy,W,28);pgText(g,'أبرز الإنجازات',R-12,yy+14,'right','#fff',700,14);yy+=34;
    pins.forEach(function(a){var lines=pgWrap(g,a.title,600,13.5,W-170),h=lines.length*20+8;room(h);
      pgGem(g,R-10,yy+12,6,'#c9962b');var ty=yy+12;lines.forEach(function(t){pgText(g,t,R-26,ty,'right','#1b2422',600,13.5);ty+=20;});
      pgText(g,CSHORT[a.cat]+' · '+fdShort(a.date),L,yy+12,'left','#666',400,12);yy+=h;});yy+=6;}
  /* جدول لكل تصنيف فيه إنجازات */
  var c1=96,c3=74,c2=W-c1-c3;
  CATS.forEach(function(c,i){var l=list.filter(function(a){return a.cat===i;});if(!l.length)return;
    room(70);yy+=10;g.x.fillStyle=COL[i];g.x.fillRect(L,yy,W,28);pgText(g,c+' ('+l.length+')',R-12,yy+14,'right','#fff',700,14);yy+=28;
    pgCell(g,R-c1,yy,c1,24,'التاريخ',{bg:'#f6f1e6',w:600,s:12});pgCell(g,R-c1-c2,yy,c2,24,'الإنجاز',{bg:'#f6f1e6',w:600,s:12});pgCell(g,L,yy,c3,24,'الدور',{bg:'#f6f1e6',w:600,s:12});yy+=24;
    l.forEach(function(a,j){var lines=pgWrap(g,a.title,500,13,c2-(a.pin?30:16)),nl=a.note?pgWrap(g,a.note,400,11.5,c2-16):[],h=Math.max(28,lines.length*19+nl.length*16+10);
      room(h);var z=j%2?'#fbf8f1':'#fff';
      pgBox(g,L,yy,W,h,z,'#e3d9c4');pgBox(g,R-c1,yy,c1,h,null,'#e3d9c4');pgBox(g,L,yy,c3,h,null,'#e3d9c4');
      pgText(g,fdShort(a.date),R-c1/2,yy+h/2,'center','#333',400,12);pgText(g,a.role||'منفّذ',L+c3/2,yy+h/2,'center','#333',400,12);
      var ty=yy+14;if(a.pin)pgGem(g,R-c1-12,ty,5,'#c9962b');lines.forEach(function(t){pgText(g,t,R-c1-(a.pin?24:8),ty,'right','#1b2422',500,13);ty+=19;});nl.forEach(function(t){pgText(g,t,R-c1-8,ty-2,'right','#666',400,11.5);ty+=16;});
      yy+=h;});});
  room(SIGN_H+40);pgSign(g,yy+34,L,R);
  pages.push(g);pages.forEach(function(p,i){pgFoot(p,i,pages.length);});
  return pages;
}

/* ---------- الرسائل ---------- */
var toastT;
function toast(msg,act,warn,label){
  clearTimeout(toastT);var o=document.getElementById('toast');if(o)o.remove();
  var d=document.createElement('div');d.className='toast'+(warn?' warn':'')+(document.getElementById('layer').innerHTML?' low':'');d.id='toast';d.setAttribute('role','status');
  d.innerHTML='<span>'+msg+'</span>'+(act?'<button>'+(label||'تراجع')+'</button>':'');
  if(act)d.querySelector('button').onclick=function(){d.remove();act();save();render(true);};
  document.getElementById('dev').appendChild(d);toastT=setTimeout(function(){d.remove();},5000);
}
function refuse(msg){toast(msg,null,true);}

/* ---------- لحظة الإنجاز ---------- */
function celebrate(rowId,after){var r=document.getElementById(rowId);if(!r||reducedMotion()){after();return;}
  r.classList.add('done','pop','fold');var ck=r.querySelector('.ck');ck.innerHTML=IC.check;
  for(var i=0;i<6;i++){var sp=document.createElement('span'),a=(i/6)*Math.PI*2+.3;sp.className='spk';sp.style.setProperty('--x',Math.round(Math.cos(a)*22)+'px');sp.style.setProperty('--y',Math.round(Math.sin(a)*22)+'px');r.appendChild(sp);}
  setTimeout(after,650);}

function onClick(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return false;var a=b.dataset.act;
  if(b.dataset.confirm&&!b.dataset.armed){b.dataset.armed='1';b.classList.add('armed');b.dataset.label=b.innerHTML;b.textContent='اضغط مرة أخرى للتأكيد';setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.classList.remove('armed');b.innerHTML=b.dataset.label;}},4000);return false;}
  if(a==='shade'){if(ev.target===b)closeLayer();return false;}
  if(a==='closel'){closeLayer();return false;}
  var nr=noteClick(a,b);if(nr!==null)return nr;
  if(a==='tab'){UI.tab=b.dataset.id;UI.cat=null;UI.qf='';if(UI.tab==='today')UI.day=null;closeLayer();render();return false;}
  if(a==='day'){UI.day=b.dataset.d===today()?null:b.dataset.d;UI.qf='';render(true);return false;}
  /* مربعات الأولوية، وتقويم «مهامي» وتبويباته */
  if(a==='qf'){UI.qf=UI.qf===b.dataset.k?'':b.dataset.k;render(true);var sc=document.getElementById('sched');if(sc&&UI.qf)sc.scrollIntoView({block:'start',behavior:'smooth'});return false;}
  if(a==='calsel'){UI.sel=b.dataset.d;UI.tseg='day';render(true);return false;}
  if(a==='calnav'){UI.cal=addMonth(UI.cal||(UI.sel||today()).slice(0,7),Number(b.dataset.n));render(true);return false;}
  if(a==='tseg'){UI.tseg=b.dataset.k;render(true);return false;}
  if(a==='capture'){UI.capTxt='';capSheet();setTimeout(function(){var i=document.getElementById('capin');if(i)i.focus();},60);return false;}
  if(a==='capdef'){UI.capDef=b.dataset.k;capSheet();return false;}
  if(a==='capsave'){var cl=capParse(UI.capTxt||'',UI.capDef||'today');if(!cl.length)return false;
    cl.forEach(function(o,i){D.items.push({id:uid(),type:o.type,title:o.title,date:o.date,time:o.time,note:'',rep:null,done:false,created:Date.now()+i,eve:o.type==='task'&&o.eve,due:o.type==='task'?o.due:null,pri:'',steps:[],points:[]});});
    UI.capTxt='';closeLayer();render(true);toast('أُضيفت '+plural(cl.length,'مهمة واحدة','مهمتان','مهام','مهمة'));return true;}
  if(a==='wk'){var base=UI.day||today(),ws0=weekStart(base);if(!UI.day&&dow(today())>=5)ws0=addDays(ws0,7);var nd=addDays(ws0,Number(b.dataset.d));UI.day=weekStart(today())===nd?null:nd;render(true);return false;}
  if(a==='add'){openAdd({type:b.dataset.type,d:b.dataset.d});return false;}
  if(a==='edit'){openEdit(b.dataset.id,b.dataset.day);return false;}
  if(a==='editach'){openAch(b.dataset.id);return false;}
  /* إنجاز مهمة: لمسة واحدة، ولحظة «غرزة السدو»، ثم عرض إضافتها إلى الإنجازات */
  if(a==='done'){var it=item(b.dataset.id),s=b.dataset.day;if(!it)return false;var was=isDone(it,s);
    if(it.rep){it.doneDates=it.doneDates||[];if(was)it.doneDates=it.doneDates.filter(function(x){return x!==s;});else it.doneDates.push(s);}
    else{it.done=!was;it.doneAt=it.done?Date.now():null;}
    if(was){render(true);return true;}
    if(it.type==='habit'){celebrate('r-'+it.id+'-'+s,function(){render(true);var k=hStreak(it);toast(k>1?'أحسنت — 🔥 <span class="num">'+k+'</span> أيام متتالية في «'+esc(it.title.slice(0,22))+'»':'أحسنت — بداية السلسلة');});return true;}
    celebrate('r-'+it.id+'-'+s,function(){render(true);toast('أُنجزت «'+esc(it.title.slice(0,26))+'»',function(){openAdd({type:'ach',title:it.title,d:s,from:it.id});},false,'لإنجازاتي');});return true;}
  if(a==='toach'){var it2=item(b.dataset.id);if(!it2)return false;closeLayer();openAdd({type:'ach',title:it2.title,d:b.dataset.day,from:it2.id});return false;}
  if(a==='mv'){var im=item(b.dataset.id),to=b.dataset.to;im.date=to==='later'?null:addDays(today(),Number(to));render(true);return true;}
  if(a==='allToday'){var od=overdue();od.forEach(function(x){x.date=today();});render(true);toast('نُقلت <span class="num">'+od.length+'</span> إلى اليوم');return true;}

    toast('حُذفت «'+esc(dx.title.slice(0,26))+'»',function(){D.items.splice(di,0,dx);D.trash=D.trash.filter(function(t){return t.obj!==dx;});});return true;}
  if(a==='delach'){var ax=achById(b.dataset.id);var ai=D.ach.indexOf(ax);D.ach.splice(ai,1);trash('ach',ax);closeLayer();render(true);
    toast('حُذف الإنجاز',function(){D.ach.splice(ai,0,ax);D.trash=D.trash.filter(function(t){return t.obj!==ax;});});return true;}
  if(a==='untrash'){var tx=D.trash.filter(function(t){return t.obj.id===b.dataset.id;})[0];if(!tx)return false;D.trash.splice(D.trash.indexOf(tx),1);(tx.kind==='ach'?D.ach:tx.kind==='note'?D.notes:D.items).push(tx.obj);render(true);toast('أُرجع «'+esc((tx.obj.title||tx.obj.text||'').slice(0,26))+'»');return true;}

      eve:e.type==='task'&&!!e.eve,pri:e.type==='task'?(e.pri||''):'',due:e.type==='task'&&!e.rep?(e.due||null):null,steps:e.type==='task'?e.steps.filter(function(x){return x.t.trim();}):[],points:e.type==='meet'?e.points.filter(function(x){return x.t.trim();}):(o.points||[])});

    if(!e.alarm)delete o.cal;
    var aw=(o.time||o.due)?alertAt(o):null;if(e.alarm&&aw&&aw>new Date()&&o.cal!==calKey(o))remind(o);else toast('حُفظ');return true;}

var TAP={t:0,x:0,y:0};
document.addEventListener('touchstart',function(ev){var p=ev.touches[0];if(p){TAP.x=p.clientX;TAP.y=p.clientY;}},{passive:true});
document.addEventListener('touchend',function(ev){
  var now=Date.now(),p=ev.changedTouches[0],t=ev.target,still=p&&Math.abs(p.clientX-TAP.x)<10&&Math.abs(p.clientY-TAP.y)<10;

},{passive:false});
